spring:
  datasource:
    url: ${SUBLY_DB_URL:}
    username: ${SUBLY_DB_USERNAME:}
    password: ${SUBLY_DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update

subly:
  jwt:
    secret: ${SUBLY_JWT_SECRET:}

  payment:
    gateway: razorpay
    webhook-secret: ${SUBLY_PAYMENT_WEBHOOK_SECRET:}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}

cors:
  allowed-origins: ${SUBLY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}